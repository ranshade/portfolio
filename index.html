<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />

    <!--
      Applies the saved theme before first paint so a returning dark-mode
      visitor never sees a white flash. Must stay inline and in <head>.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "dark" ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          /* private mode: fall back to the light default */
        }
      })();
    </script>

    <title>Ransh — Full Stack Developer</title>
    <meta
      name="description"
      content="Ransh is a full stack developer building fast, accessible, and thoughtfully designed web applications with React, Node.js, and modern tooling."
    />
    <meta name="author" content="Ransh" />
    <meta name="keywords" content="full stack developer, react developer, frontend developer, web developer portfolio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ransh — Full Stack Developer" />
    <meta
      property="og:description"
      content="Building digital experiences that make an impact — a portfolio of web applications, dashboards, and interfaces."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ransh — Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Building digital experiences that make an impact — a portfolio of web applications, dashboards, and interfaces."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
